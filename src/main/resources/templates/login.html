<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <div class="container-fluid vh-100 d-flex flex-column justify-content-center">
        <div class="container mb-4">
            <div class="row">
                <div class="col-12">
                    <h1 class="text-center">Accedi</h1>
                    <h2 class="text-center">Inserisci username e password</h2>
                </div>
            </div>
        </div>
        
        <div th:if="${param.error}">
            Invalid username and password .
        </div>
        <div th:if="${param.logout}">
            You have been logged out .
        </div>
        
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-6">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="usernameLogin" class="form-label">Username</label>
                            <input type="text" id="usernameLogin" class="form-control" name="username">
                        </div>
                        <div class="mb-3">
                            <label for="passwordLogin" class="form-label">Password</label>
                            <input type="password" id="passwordLogin" class="form-control" name="password">
                        </div>
                        <div class="d-flex justify-content-evenly mt-4">
                            <button type="submit" value="Log In" class="btn btn-primary">Log In</button>
                            <button type="reset" class="btn btn-secondary">Reset</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
