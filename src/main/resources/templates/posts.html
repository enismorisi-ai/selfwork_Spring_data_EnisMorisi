<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Thymeleaf</title>
    <!-- BS CSS  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Fontawesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Custom CSS  -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="/index.html">Homepage</a></li>
            <li><a th:href="@{/authors}">Authors</a></li>
            <li><a th:href="@{/authors/create}">Add author</a></li>
            <li><a th:href="@{/posts}">All posts</a></li>
            <li><a th:href="@{/comments}">All comments</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center display-1 text-primary mb-3" th:text="${title}">All the posts</h1>
                <a th:href="@{/posts/create}" class="btn btn-info"><i class="fa-solid fa-plus"></i></a>
            </div>
        </div>
    </div>

    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-9">
                <table class="table table-striped table-responsive-lg">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Title</th>
                            <th>Body</th>
                            <th>Publish date</th>
                            <th>Author</th>
                            <!-- <th>Comments</th> -->
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="post:${posts}">
                            <td th:text="${post.id}"></td> <!-- queste proprieta si riferiscono alle proprieta di PostDto e non di Post-->
                            <td th:text="${post.title}"></td>
                            <td th:text="${post.body}"></td>
                            <td th:text="${post.publishDate}"></td>
                            <td th:text="${post.authorId}"></td>
                            <td>
                                <a th:href="@{/posts/remove/{id}(id=${post.id})}" class="btn btn-danger">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                                <a th:href="@{/posts/update/{id}(id=${post.id})}" class="btn btn-warning mt-2">
                                    <i class="fa-solid fa-pen "></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
